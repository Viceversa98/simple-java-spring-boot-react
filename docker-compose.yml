# WHY: Optional Postgres via Docker for machines without a local install
# (e.g. copying this project to Windows). Matches application.yml credentials.
services:
  postgres:
    image: postgres:17
    container_name: kanban-postgres
    environment:
      POSTGRES_DB: kanban
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
    ports:
      - "5432:5432"
    volumes:
      - kanban_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban -d kanban"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kanban_pgdata:
